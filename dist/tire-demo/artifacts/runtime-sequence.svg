<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 730"><title>Recommendation request</title><rect width="1100" height="730" fill="#f6f5ef"/><text x="40" y="45" font-family="Arial" font-size="24" fill="#192d26">Recommendation request</text><rect x="40" y="75" width="1010" height="55" rx="5" fill="#fbfaf6" stroke="#cbd4c0"/><text x="60" y="109" font-family="Arial" font-size="15" fill="#192d26">01  Retailer UI → API: typed requirements + simulated scope</text><path d="M550 130v18m-4-4l4 4 4-4" fill="none" stroke="#73886a"/><rect x="40" y="150" width="1010" height="55" rx="5" fill="#edf0e5" stroke="#cbd4c0"/><text x="60" y="184" font-family="Arial" font-size="15" fill="#192d26">02  API → State: load and merge owned preferences</text><path d="M550 205v18m-4-4l4 4 4-4" fill="none" stroke="#73886a"/><rect x="40" y="225" width="1010" height="55" rx="5" fill="#fbfaf6" stroke="#cbd4c0"/><text x="60" y="259" font-family="Arial" font-size="15" fill="#192d26">03  API → SQL: scoped eligibility, availability and ranking</text><path d="M550 280v18m-4-4l4 4 4-4" fill="none" stroke="#73886a"/><rect x="40" y="300" width="1010" height="55" rx="5" fill="#edf0e5" stroke="#cbd4c0"/><text x="60" y="334" font-family="Arial" font-size="15" fill="#192d26">04  SQL → API: candidates + observation times + score contributions</text><path d="M550 355v18m-4-4l4 4 4-4" fill="none" stroke="#73886a"/><rect x="40" y="375" width="1010" height="55" rx="5" fill="#fbfaf6" stroke="#cbd4c0"/><text x="60" y="409" font-family="Arial" font-size="15" fill="#192d26">05  API → Product lookup: authorized candidate descriptions</text><path d="M550 430v18m-4-4l4 4 4-4" fill="none" stroke="#73886a"/><rect x="40" y="450" width="1010" height="55" rx="5" fill="#edf0e5" stroke="#cbd4c0"/><text x="60" y="484" font-family="Arial" font-size="15" fill="#192d26">06  API → Explanation: template or validated model emphasis</text><path d="M550 505v18m-4-4l4 4 4-4" fill="none" stroke="#73886a"/><rect x="40" y="525" width="1010" height="55" rx="5" fill="#fbfaf6" stroke="#cbd4c0"/><text x="60" y="559" font-family="Arial" font-size="15" fill="#192d26">07  API → State / Trace: persist revision and request evidence</text><path d="M550 580v18m-4-4l4 4 4-4" fill="none" stroke="#73886a"/><rect x="40" y="600" width="1010" height="55" rx="5" fill="#edf0e5" stroke="#cbd4c0"/><text x="60" y="634" font-family="Arial" font-size="15" fill="#192d26">08  API → UI: alternatives, optional upgrade and facts</text><text x="40" y="710" font-family="Arial" font-size="11" fill="#69716a">Independent implementation · all records and fitment requirements are synthetic</text></svg>