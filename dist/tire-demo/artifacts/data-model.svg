<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 730"><title>Logical data model</title><rect width="1100" height="730" fill="#f6f5ef"/><text x="40" y="45" font-family="Arial" font-size="24" fill="#192d26">Logical data model</text><rect x="40" y="75" width="1010" height="55" rx="5" fill="#fbfaf6" stroke="#cbd4c0"/><text x="60" y="109" font-family="Arial" font-size="15" fill="#192d26">01  PRODUCT (product_id PK): size, load/speed, price, attributes</text><path d="M550 130v18m-4-4l4 4 4-4" fill="none" stroke="#73886a"/><rect x="40" y="150" width="1010" height="55" rx="5" fill="#edf0e5" stroke="#cbd4c0"/><text x="60" y="184" font-family="Arial" font-size="15" fill="#192d26">02  VEHICLE (vehicle_id PK): illustrative size + minimum specs + version</text><path d="M550 205v18m-4-4l4 4 4-4" fill="none" stroke="#73886a"/><rect x="40" y="225" width="1010" height="55" rx="5" fill="#fbfaf6" stroke="#cbd4c0"/><text x="60" y="259" font-family="Arial" font-size="15" fill="#192d26">03  LOCATION (store_id PK): coordinates, kind, delivery estimate</text><path d="M550 280v18m-4-4l4 4 4-4" fill="none" stroke="#73886a"/><rect x="40" y="300" width="1010" height="55" rx="5" fill="#edf0e5" stroke="#cbd4c0"/><text x="60" y="334" font-family="Arial" font-size="15" fill="#192d26">04  INVENTORY (product_id + store_id PK): quantity + observation epoch</text><path d="M550 355v18m-4-4l4 4 4-4" fill="none" stroke="#73886a"/><rect x="40" y="375" width="1010" height="55" rx="5" fill="#fbfaf6" stroke="#cbd4c0"/><text x="60" y="409" font-family="Arial" font-size="15" fill="#192d26">05  RETAILER_SCOPE (retailer_id + store_id PK): assigned locations</text><path d="M550 430v18m-4-4l4 4 4-4" fill="none" stroke="#73886a"/><rect x="40" y="450" width="1010" height="55" rx="5" fill="#edf0e5" stroke="#cbd4c0"/><text x="60" y="484" font-family="Arial" font-size="15" fill="#192d26">06  SESSION_STATE (session_id PK): retailer owner, filter JSON, revision</text><path d="M550 505v18m-4-4l4 4 4-4" fill="none" stroke="#73886a"/><rect x="40" y="525" width="1010" height="55" rx="5" fill="#fbfaf6" stroke="#cbd4c0"/><text x="60" y="559" font-family="Arial" font-size="15" fill="#192d26">07  INVENTORY_EVENT (event_id PK): canonical payload + outcome</text><path d="M550 580v18m-4-4l4 4 4-4" fill="none" stroke="#73886a"/><rect x="40" y="600" width="1010" height="55" rx="5" fill="#edf0e5" stroke="#cbd4c0"/><text x="60" y="634" font-family="Arial" font-size="15" fill="#192d26">08  Product/location keys connect stock; scope constrains every query</text><text x="40" y="710" font-family="Arial" font-size="11" fill="#69716a">Independent implementation · all records and fitment requirements are synthetic</text></svg>