repos:
  - repo: local
    hooks:
      - id: quick-checks
        name: Formatting, lint and secrets
        entry: make quick
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: full-checks
        name: Full developer checks
        entry: make check
        language: system
        pass_filenames: false
        stages: [pre-push]
